[package]
name = "cursed_secp256k1"
version = "0.1.2"
edition = "2024"
description = "ECDSA over secp256k1 where every field element is a Vec<Digit> and every operation goes through cursed_arithmetic"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rot13maxi/cursed_secp256k1"
keywords = ["ecdsa", "secp256k1", "cryptography", "cursed"]
categories = ["cryptography"]

[dependencies]
cursed_arithmetic = "0.1.0"

[dev-dependencies]
num-bigint = "0.4"
